name: Android CI Build

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # التغيير هنا: حددنا النسخة الخاصة بجيت هب فقط
    - name: Build GitHub Version
      run: ./gradlew assembleExtendedGithubRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NativeAlpha-APK
        # التغيير هنا: وسعنا البحث ليجد الملف في أي مجلد فرعي
        path: app/build/outputs/apk/**/*.apk
        
