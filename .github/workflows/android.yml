name: Android CI Build

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # التغيير الجوهري هنا: طلبنا نسخة Debug لأنها موقعة وجاهزة للتثبيت
    - name: Build GitHub Debug Version
      run: ./gradlew assembleExtendedGithubDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NativeAlpha-Debug-APK
        # سيقوم بالبحث عن ملفات الـ Debug فقط
        path: app/build/outputs/apk/**/debug/*.apk
        
